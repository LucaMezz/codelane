services:
  postgres:
    image: postgres:17
    container_name: codelane-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelane}
      POSTGRES_USER: ${POSTGRES_USER:-codelane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelane}
    volumes:
      - codelane-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-codelane}\" -d \"${POSTGRES_DB:-codelane}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: codelane-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT:-4000}
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-codelane}:${POSTGRES_PASSWORD:-codelane}@postgres:5432/${POSTGRES_DB:-codelane}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: codelane-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  codelane-postgres-data:
