services:
  postgres:
    image: postgres:17
    container_name: codelane-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelane}
      POSTGRES_USER: ${POSTGRES_USER:-codelane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelane}
    volumes:
      - codelane-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: codelane-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        API_PORT: ${API_PORT:-4000}
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-4000}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-codelane}:${POSTGRES_PASSWORD:-codelane}@postgres:5432/${POSTGRES_DB:-codelane}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  api-dev:
    container_name: codelane-api-dev
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --ignore-scripts && pnpm --filter @codelane/api dev"
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      PORT: ${API_PORT:-4000}
      DATABASE_URL: postgres://${POSTGRES_USER:-codelane}:${POSTGRES_PASSWORD:-codelane}@postgres:5432/${POSTGRES_DB:-codelane}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  codelane-postgres-data:
