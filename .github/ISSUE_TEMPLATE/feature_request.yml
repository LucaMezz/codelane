name: Feature request
description: Suggest a new capability or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should this solve?
      placeholder: Describe the concrete need before describing the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - apps/api
        - apps/cli
        - apps/desktop
        - apps/web
        - packages/api-client
        - packages/config
        - packages/core
        - packages/frontend
        - packages/ui
        - docs
        - tooling/CI
        - repository template
        - unknown
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Mention package boundaries, migrations, config/env changes, security implications, or breaking behavior if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched existing issues and pull requests.
        - label: I considered whether this belongs in an app or shared package.
