name: Question
description: Ask a focused question about using or contributing to AppKit.
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you already tried or read?
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - apps/api
        - apps/cli
        - apps/desktop
        - apps/web
        - packages/api-client
        - packages/config
        - packages/core
        - packages/frontend
        - packages/ui
        - docs
        - tooling/CI
        - unknown
